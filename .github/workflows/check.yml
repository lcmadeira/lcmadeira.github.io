name: Verificar site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: HTML, links, PT/EN e privacidade
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: python3 scripts/check-site.py --external
