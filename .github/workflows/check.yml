name: Verificar site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: HTML, links, PT/EN e privacidade
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: python3 scripts/check-site.py --external
