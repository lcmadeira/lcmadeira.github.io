<!doctype html>
<!--
  Modelo das imagens de pré-visualização (assets/og.png e assets/og-en.png, 1200x630).
  Para as refazer, servir o repositório e fotografar com o Firefox:
    python3 -m http.server 8000
    firefox --headless --window-size=1200,630 --screenshot og.png    "http://localhost:8000/scripts/og-image.html"
    firefox --headless --window-size=1200,630 --screenshot og-en.png "http://localhost:8000/scripts/og-image.html?en"
  A frase tem de ser igual à do topo das páginas (class="lede").
-->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Imagem de pré-visualização</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0C0E13; font-family: "Inter", sans-serif; }
  .card {
    position: absolute; inset: 57px; box-sizing: border-box;
    background: #161A22; border: 1px solid #232834; border-radius: 24px;
    padding: 52px 64px 50px;
    display: grid; grid-template-rows: auto 1fr auto;
  }
  .prompt { margin: 0; font: 700 34px/1 ui-monospace, "DejaVu Sans Mono", monospace; color: #E7EAF0; }
  .prompt b { color: #6EA8FE; font-weight: 700; }
  .prompt span { color: #8A93A5; }
  .main { display: grid; grid-template-columns: 150px 1fr; column-gap: 56px; align-items: center; }
  .logo { width: 150px; height: 150px; display: block; }
  h1 { margin: 0 0 18px; font: 700 68px/1.05 "Inter", sans-serif; color: #E7EAF0; letter-spacing: -0.03em; }
  .lede { margin: 0; max-width: 720px; font: 400 29px/1.45 "Inter", sans-serif; color: #B7BFCC; }
  .nw { white-space: nowrap; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 26px; border-top: 1px solid #232834; }
  .pills { display: flex; gap: 12px; }
  .pills span { font: 500 20px/1 "Inter", sans-serif; color: #B7BFCC; border: 1px solid #2E3442; border-radius: 999px; padding: 9px 16px; display: flex; align-items: center; gap: 10px; }
  .pills i { width: 10px; height: 10px; border-radius: 50%; background: #3CC48A; }
  .domain { font: 600 24px/1 "Inter", sans-serif; color: #6EA8FE; }
</style>
</head>
<body>
<div class="card">
  <p class="prompt"><b>~</b> <span>$</span> whoami</p>
  <div class="main">
    <img class="logo" src="../favicon.svg" alt="">
    <div>
      <h1>Luís Carlos Madeira</h1>
      <p class="lede" id="lede">Automação de processos, monitorização de operações e infraestrutura <span class="nw">self-hosted</span>.</p>
    </div>
  </div>
  <div class="foot">
    <div class="pills"><span><i></i>Python</span><span><i></i>JavaScript</span><span><i></i>Docker</span><span><i></i>GitHub Actions</span></div>
    <span class="domain">lcmadeira.github.io</span>
  </div>
</div>
<script>
  if (location.search.indexOf('en') !== -1) {
    document.documentElement.lang = 'en';
    document.getElementById('lede').innerHTML = 'Process automation, operations monitoring and <span class="nw">self-hosted</span> infrastructure.';
  }
</script>
</body>
</html>
